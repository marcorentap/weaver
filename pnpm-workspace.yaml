packages:
  - "apps/*"
  - "packages/*"
  - "plugins/*"
allowBuilds:
  # Both arrive with the agent SDK; neither postinstall is needed here —
  # @google/genai only fetches optional native bits for providers we never
  # call, and protobufjs precompiles descriptors it also builds lazily.
  '@google/genai': false
  protobufjs: false
  sharp: false
  unrs-resolver: false
  # Electron's postinstall downloads its prebuilt binary; esbuild's fetches
  # its native platform binary. Both are required for apps/desktop to run.
  electron: true
  esbuild: true
